# Site: api-staging - PostgreSQL Database
services:
  postgres:
    image: postgres:15-alpine
    hostname: ${POSTGRES_HOST}
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD_FILE=${POSTGRES_PASSWORD_FILE}
    secrets:
      - source: ${SECRETS_PREFIX}postgres_password
        target: ${POSTGRES_PASSWORD_FILE}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - backend
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.labels.database == true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  pgadmin:
    image: dpage/pgadmin4:latest
    environment:
      - PGADMIN_DEFAULT_EMAIL=${PGADMIN_EMAIL:-admin@example.com}
      - PGADMIN_DEFAULT_PASSWORD_FILE=/run/secrets/${SECRETS_PREFIX}pgadmin_password
      - PGADMIN_CONFIG_SERVER_MODE=False
      - PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED=False
    secrets:
      - source: ${SECRETS_PREFIX}pgadmin_password
        target: /run/secrets/${SECRETS_PREFIX}pgadmin_password
    ports:
      - "${PGADMIN_PORT}:80"
    networks:
      - backend
    deploy:
      mode: replicated
      replicas: 1

volumes:
  postgres-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DATA_DIR}/postgres
