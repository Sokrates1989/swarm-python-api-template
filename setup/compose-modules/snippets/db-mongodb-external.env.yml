# MongoDB API environment fragment for an operator-supplied external service.
# The external password uses the same Docker-secret file contract as local mode.
      DB_TYPE: mongodb
      DB_MODE: external
      MONGODB_HOST: ${DB_HOST}
      MONGODB_PORT: ${DB_PORT}
      MONGODB_DB: ${DB_NAME}
      MONGODB_USER: ${DB_USER}
      MONGODB_PASSWORD_FILE: /run/secrets/XXX_CHANGE_ME_DB_PASSWORD_XXX
