# MongoDB API environment fragment for a database service in this Swarm stack.
# The password is mounted as a Docker secret; no plaintext credential is used.
      DB_TYPE: mongodb
      DB_MODE: local
      MONGODB_HOST: ${DB_HOST}
      MONGODB_PORT: ${DB_PORT}
      MONGODB_DB: ${DB_NAME}
      MONGODB_USER: ${DB_USER}
      MONGODB_PASSWORD_FILE: /run/secrets/XXX_CHANGE_ME_DB_PASSWORD_XXX
