# Database-management labels when TLS terminates at an upstream proxy.
# Service routing tokens are resolved by the shared service-type adapter.
      labels:
        - traefik.enable=true
        - traefik.constraint-label=${TRAEFIK_CONSTRAINT_LABEL}
        - traefik.docker.network=${TRAEFIK_NETWORK}
        - traefik.http.routers.${STACK_NAME}_XXX_ADMIN_SUFFIX.service=${STACK_NAME}_XXX_ADMIN_SUFFIX
        - traefik.http.services.${STACK_NAME}_XXX_ADMIN_SUFFIX.loadbalancer.server.port=XXX_ADMIN_PORT
        - traefik.http.routers.${STACK_NAME}_XXX_ADMIN_SUFFIX.rule=Host(`XXX_ADMIN_DOMAIN_EXPRESSION`)
        - traefik.http.routers.${STACK_NAME}_XXX_ADMIN_SUFFIX.entrypoints=http
        - traefik.http.middlewares.${STACK_NAME}_XXX_ADMIN_SUFFIX_protoheader.headers.customrequestheaders.X-Forwarded-Proto=https
        - traefik.http.routers.${STACK_NAME}_XXX_ADMIN_SUFFIX.middlewares=${STACK_NAME}_XXX_ADMIN_SUFFIX_protoheader
