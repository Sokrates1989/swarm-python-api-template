# Secure Messaging internal API service template.
# This service is intentionally internal-only.
services:
  secure_messaging_api:
    image: ${IMAGE_NAME}:${IMAGE_VERSION}
    networks:
      XXX_CHANGE_ME_INTERNAL_NETWORK_XXX:
        aliases:
          - secure_messaging_api
    secrets:
      - secure_messaging_auth_token
      - secure_messaging_telegram_metadata
      - secure_messaging_telegram_tokens
      - secure_messaging_email_metadata
      - secure_messaging_email_passwords
    environment:
      APP_PROFILE: secure_messaging
      BACKEND_APP_ID: secure_messaging
      DB_TYPE: none
      DB_MODE: none
      PORT: 8080
      DEBUG: ${DEBUG:-false}
      DEBUG_ENABLED: ${DEBUG_ENABLED:-false}
      LOG_DIR: /app/logs
      LOG_TIMEZONE: ${LOG_TIMEZONE:-Europe/Berlin}
      SECURE_MESSAGING_AUTH_TOKEN_FILE: /run/secrets/secure_messaging_auth_token
      SECURE_MESSAGING_TELEGRAM_SENDERS_FILE: /run/secrets/secure_messaging_telegram_metadata
      SECURE_MESSAGING_TELEGRAM_SENDER_TOKENS_FILE: /run/secrets/secure_messaging_telegram_tokens
      SECURE_MESSAGING_EMAIL_SENDERS_FILE: /run/secrets/secure_messaging_email_metadata
      SECURE_MESSAGING_EMAIL_SENDER_PASSWORDS_FILE: /run/secrets/secure_messaging_email_passwords
      SECURE_MESSAGING_RATE_LIMIT_PER_MINUTE: ${SECURE_MESSAGING_RATE_LIMIT_PER_MINUTE:-30}
    volumes:
      - ${DATA_ROOT}/logs/api:/app/logs
    deploy:
      mode: replicated
      replicas: ${API_REPLICAS:-1}
###MEMORY_LIMIT_START###
      resources:
        limits:
          memory: ${MEMORY_LIMIT}
###MEMORY_LIMIT_END###
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health').read()"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
