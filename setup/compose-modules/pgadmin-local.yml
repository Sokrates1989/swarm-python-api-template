# pgAdmin service for PostgreSQL database management
# Replicas=0 by default (disabled), can be enabled via menu toggle
  pgadmin:
    image: dpage/pgadmin4:latest
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD_FILE: /run/secrets/XXX_CHANGE_ME_PGADMIN_PASSWORD_XXX
      PGADMIN_LISTEN_PORT: 5050
      # Connect to postgres service
      PGADMIN_CONFIG_SERVER_MODE: "True"
    networks:
      - backend
###ADMIN_TRAEFIK_NETWORK_START###
      - XXX_CHANGE_ME_TRAEFIK_NETWORK_NAME_XXX
###ADMIN_TRAEFIK_NETWORK_END###
    volumes:
      - ${DATA_ROOT}/pgadmin:/var/lib/pgadmin
    secrets:
      - XXX_CHANGE_ME_PGADMIN_PASSWORD_XXX
###ADMIN_DIRECT_PORTS_START###
    ports:
      - target: 5050
        published: ${PGADMIN_PUBLISHED_PORT}
        protocol: tcp
        mode: host
###ADMIN_DIRECT_PORTS_END###
    deploy:
      mode: replicated
      replicas: ${PGADMIN_REPLICAS:-0}
      restart_policy:
        condition: any
        delay: 5s
      resources:
        limits:
          memory: 256M
###ADMIN_TRAEFIK_LABELS_START###
###ADMIN_TRAEFIK_LABELS###
###ADMIN_TRAEFIK_LABELS_END###
